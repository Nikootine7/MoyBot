[project]
name = "moybot"
version = "0.1.0"
description = "MOYBOT — event-driven, delta-first crypto-trading intelligence pipeline (Phase 1 scaffold)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
]

[project.scripts]
moybot = "moybot.app.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.122.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moybot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ANN",
    "PL",
]
# Domain objects are constructed with keyword arguments throughout; positional-argument counts
# are not a meaningful signal here.
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["moybot", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# Fail-closed validation is a sequence of independent early cancellations (PROJECT_SPEC.md §5);
# collapsing them would obscure which condition cancelled the trade.
"src/moybot/core/validation/material_deterioration.py" = ["PLR0911"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "hypothesis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
